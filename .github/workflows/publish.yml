name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: python -m pip install -e '.[dev]' twine
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          import writune
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match package version'
          assert writune.__version__ == version, 'Runtime version must match package version'
          PY
      - name: Test
        run: python -m pytest
      - name: Verify HTTP update manifest
        run: |
          python scripts/build_update_manifest.py
          git diff --exit-code -- src/writune/update-manifest.json
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/writune-wheel-test
          /tmp/writune-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/writune-wheel-test/bin/writune --help
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/writune/
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
