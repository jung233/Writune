[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "writune"
version = "0.1.3"
description = "An asynchronous AI writing polisher for MCP agents"
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "httpx",
  "openai>=2,<3",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "typer",
  "platformdirs",
  "python-docx",
  "python-dotenv",
  "tomlkit>=0.13,<1",
  "packaging>=24",
]

[project.urls]
Homepage = "https://github.com/jung233/Writune"
Repository = "https://github.com/jung233/Writune"
Issues = "https://github.com/jung233/Writune/issues"

[project.scripts]
writune = "writune.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
writune = ["update-manifest.json", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
